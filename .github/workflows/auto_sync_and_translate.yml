name: Auto Sync & AI Translate Upstream BizHawk

on:
  schedule:
    # 每天 UTC 02:00 (北京时间 10:00) 自动检查并同步官方更新
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync_and_translate:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Chinese Pipeline Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone Upstream BizHawk
        run: |
          git clone --depth 1 https://github.com/TASEmulators/BizHawk.git upstream_bizhawk

      - name: Extract Strings & Run Incremental AI Translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python tools/bizhawk_patcher.py --repo-path upstream_bizhawk --extract
          python tools/ai_translate.py

      - name: Commit & Push Updated Dictionaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add locale/
          git diff --staged --quiet || (git commit -m "chore(i18n): update Chinese localization dictionary [skip ci]" && git push origin master)
