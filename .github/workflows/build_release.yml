name: Build & Publish BizHawk Chinese Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag 名称 (例如 v2.11.2-zh_CN)'
        required: true
        default: 'v2.11.2-zh_CN'

jobs:
  build_and_release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Chinese Pipeline Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Clone Official BizHawk Source & Assets (Matching Tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Write-Host "Fetching latest official BizHawk release tag..."
          $tag = (gh release view --repo TASEmulators/BizHawk --json tagName -q .tagName).Trim()
          Write-Host "Target release tag: $tag"
          
          Write-Host "Cloning official BizHawk source at tag $tag..."
          git clone --depth 1 --branch $tag https://github.com/TASEmulators/BizHawk.git bizhawk_src
          
          Write-Host "Downloading matching official BizHawk binary release base..."
          gh release download --repo TASEmulators/BizHawk --pattern "*win-x64.zip" --output "official_release.zip"

      - name: Apply Chinese Translation Patch
        run: |
          python tools/bizhawk_patcher.py --repo-path bizhawk_src --patch

      - name: Build Patched BizHawk Solution
        shell: pwsh
        run: |
          cd bizhawk_src
          Write-Host "Building entire BizHawk.sln..."
          dotnet build BizHawk.sln -c Release

      - name: Assemble Final Chinese Release
        run: |
          python tools/assemble_release.py

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "BizHawk 中文汉化版 ${{ github.event.inputs.release_tag || github.ref_name }}"
          body: |
            ### 🎮 BizHawk 官方最新全量中文汉化版发布

            本版本由 **[BizHawk-Chinese](https://github.com/ashanzzz/bizhawk-chinese)** 自动化流水线自动拉取官方最新源码、匹配 TAS 专业中文词典库并结合 AI 增量翻译构建发布。

            #### 🌟 特性与功能
            - ✅ **100% 全量汉化**：主菜单、配置选项、快捷键映射、固件管理、屏幕 OSD。
            - ✅ **全套 TAS 工具汉化**：TAStudio 录像编辑器、RAM Search 内存搜索、RAM Watch 内存监视、十六进制编辑器 (Hex Editor)、Lua 控制台、作弊码管理器、反汇编与调试器。
            - ✅ **开箱即用，游戏全兼容**：完整内置所有官方原生模拟内核（FC/NES, SFC/SNES, N64, GB/GBA, MD/Genesis, PS1, Saturn 等），支持直接载入 ROM 与 TAS 录像工程。

            #### 📥 下载与运行
            1. 点击下方附件直接下载 **`BizHawk-Chinese-Win-x64.zip`**；
            2. 解压到任意非中文或英文字符路径（例如 `D:\BizHawk`）；
            3. 双击运行 **`EmuHawk.exe`** 即可直接体验全中文界面并畅玩游戏！
          files: |
            BizHawk-Chinese-Win-x64.zip
